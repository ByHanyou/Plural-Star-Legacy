apply plugin: "com.android.library"

android {
    namespace "app.notifee.core"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    api "androidx.annotation:annotation:1.3.0"
    api "androidx.concurrent:concurrent-futures:1.1.0"
    api "androidx.work:work-runtime:2.11.1"
    implementation "com.facebook.fresco:fresco:3.6.0"
    implementation "com.google.guava:guava:33.5.0-android"
    compileOnly "org.checkerframework:checker-qual:3.43.0"
    implementation "androidx.core:core:1.6.0"
    api "androidx.room:room-runtime:2.8.4"
    api "androidx.sqlite:sqlite:2.6.2"
    api "androidx.sqlite:sqlite-framework:2.6.2"
    annotationProcessor "androidx.room:room-compiler:2.8.4"
    api "org.greenrobot:eventbus:3.3.1"
    api "androidx.profileinstaller:profileinstaller:1.4.1"
    implementation "androidx.lifecycle:lifecycle-process:2.3.1"
}
